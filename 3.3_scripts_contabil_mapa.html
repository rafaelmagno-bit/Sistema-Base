<script>
function inicializarAnosMapaRmb() {
  const selectAno = document.getElementById("mapaRmbAno");
  if (selectAno) {
    const anoAtual = new Date().getFullYear();
    selectAno.innerHTML = "";
    for (let i = anoAtual; i >= anoAtual - 3; i--) {
      let opt = document.createElement("option"); opt.value = i; opt.innerText = i;
      selectAno.appendChild(opt);
    }
  }
}

if (window.addEventListener) {
  window.addEventListener('load', inicializarAnosMapaRmb, false);
}


/**
 * Executa o processamento do Mapa RMB trazendo saldos iniciais automáticos
 * e renderizando totais dinâmicos no rodapé da tabela.
 */
function executarMapaRMB() {
  const mesSelect = document.getElementById("mapaRmbMes");
  const anoSelect = document.getElementById("mapaRmbAno");
  
  if (!mesSelect || !anoSelect) return;
  
  const filtros = {
    mes: mesSelect.value,
    ano: anoSelect.value
  };

  const btn = document.getElementById("btnGerarMapaRmb");
  if (btn) { btn.disabled = true; btn.innerText = "⏳ Processando..."; }

  google.script.run
    .withSuccessHandler(function(resposta) {
      if (btn) { btn.disabled = false; btn.innerText = "📊 Gerar Mapa RMB"; }
      
      // Ativa o botão de impressão após carregar os dados na tabela
      const btnImp = document.getElementById("btnImprimirMapaRmb");
      if (btnImp) btnImp.disabled = false;

      const corpo = document.getElementById("corpoMapaRmb");
      if (!corpo) {
        alert("Erro Crítico de Layout: Não foi encontrado um elemento HTML com o id='corpoMapaRmb'. Verifique o arquivo de visualização.");
        return;
      }
      
      if (!resposta.sucesso) {
        alert(resposta.message);
        return;
      }

      if (!resposta.dados || resposta.dados.length === 0) {
        alert("Atenção: O servidor processou, mas nenhuma conta contábil foi retornada.");
        return;
      }

      // 🌟 SOLUÇÃO DO MISTÉRIO: Remove a classe 'hidden' do container para tornar a tabela VISÍVEL
      const containerTabela = document.getElementById("containerMapaRmb");
      if (containerTabela) {
        containerTabela.classList.remove("hidden");
      }

      // Montaremos todo o HTML em uma variável de texto para injetar de uma só vez
      let htmlGerado = "";

      // Variáveis acumuladoras para o Rodapé Totalizador
      let tInicial = 0, tEmpenho = 0, tEdital = 0, tOutrosEnt = 0;
      let tTotalEnt = 0, tTransf = 0, tOutrosSai = 0, tTotalSai = 0, tAtual = 0;

      resposta.dados.forEach(item => {
        tInicial += item.saldoInicial || 0;
        tEmpenho += item.entEmpenho || 0;
        tEdital += item.entEdital || 0;
        tOutrosEnt += item.entOutros || 0;
        tTotalEnt += item.totalEntradas || 0;
        tTransf += item.saiTransferencia || 0;
        tOutrosSai += item.saiOutros || 0;
        tTotalSai += item.totalSaidas || 0;
        tAtual += item.saldoAtual || 0;

        htmlGerado += `
          <tr data-conta="${item.conta}" data-entradas="${item.totalEntradas}" data-saidas="${item.totalSaidas}">
            <td class="col-conta text-center font-weight-bold">${item.conta}</td>
            <td>
              <input type="number" step="0.01" class="form-control form-control-sm input-saldo-inicial text-right" 
                value="${(item.saldoInicial || 0).toFixed(2)}" oninput="recalcularLinhaMapa(this)">
            </td>
            <td class="col-empenho text-right text-success">${(item.entEmpenho || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-edital text-right text-success">${(item.entEdital || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-outras-ent text-right text-success">${(item.entOutros || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-total-ent text-right font-weight-bold table-success">${(item.totalEntradas || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-transf text-right text-danger">${(item.saiTransferencia || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-outras-sai text-right text-danger">${(item.saiOutros || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-total-sai text-right font-weight-bold table-danger">${(item.totalSaidas || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
            <td class="col-atual celula-saldo-atual text-right font-weight-bold table-warning">${(item.saldoAtual || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          </tr>
        `;
      });

      // Adiciona a linha de totais estruturada ao final da variável de texto
      htmlGerado += `
        <tr id="linhaTotalizadorMapa" style="background-color: #212529; color: #ffffff; font-weight: bold;">
          <td class="text-center bg-dark text-white">TOTAL GERAL</td>
          <td class="text-right bg-dark text-white" id="totInicial">${tInicial.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-light">${tEmpenho.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-light">${tEdital.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-light">${tOutrosEnt.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-warning font-weight-bold">${tTotalEnt.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-light">${tTransf.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-light">${tOutrosSai.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-warning font-weight-bold">${tTotalSai.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
          <td class="text-right text-warning font-weight-bold" id="totAtual">${tAtual.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
        </tr>
      `;

      // Aplica tudo na tela de uma única vez de forma mandatória
      corpo.innerHTML = htmlGerado;

      // Armazena em escopo global o período ativo para uso no salvamento
      window.periodoMapaAtivo = `${filtros.mes}/${filtros.ano}`;
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.innerText = "📊 Gerar Mapa RMB"; }
      alert("Falha crítica no servidor: " + err.message);
    })
    .gerarDadosMapaRMB(filtros);
}

/**
 * 🔄 Recalcula dinamicamente a linha alterada pelo usuário E atualiza o rodapé totalizador
 */
function recalcularLinhaMapa(inputElement) {
  const tr = inputElement.closest("tr");
  const saldoInicial = parseFloat(inputElement.value) || 0;
  const totalEntradas = parseFloat(tr.getAttribute("data-entradas")) || 0;
  const totalSaidas = parseFloat(tr.getAttribute("data-saidas")) || 0;
  
  const novoSaldoAtual = saldoInicial + totalEntradas - totalSaidas;
  
  const celulaSaldoAtual = tr.querySelector(".celula-saldo-atual");
  if (celulaSaldoAtual) {
    celulaSaldoAtual.innerText = novoSaldoAtual.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  // --- RECALCULAR TOTAIS GERAIS DO RODAPÉ ---
  let somaIniciais = 0;
  let sAtuais = 0;

  // Percorre todas as linhas de dados (ignorando a última que é o totalizador)
  document.querySelectorAll("#corpoMapaRmb tr").forEach(linha => {
    if (linha.id === "linhaTotalizadorMapa") return;
    
    const inp = linha.querySelector(".input-saldo-inicial");
    const vInicial = inp ? parseFloat(inp.value) || 0 : 0;
    somaIniciais += vInicial;

    // Extrai o valor limpo da célula de saldo atual
    const textoAtual = linha.querySelector(".celula-saldo-atual").innerText;
    const vAtual = parseFloat(textoAtual.replace(/[R$\s.]/g, "").replace(",", ".")) || 0;
    sAtuais += vAtual;
  });

  // Atualiza os valores visuais no rodapé estrutural
  document.getElementById("totInicial").innerText = somaIniciais.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  document.getElementById("totAtual").innerText = sAtuais.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

/**
 * 💾 ENVIA OS DADOS DA TELA PARA SALVAR NA ABA 'MAPA_RMB'
 */
function salvarMapaPlanilha() {
  const linhas = document.querySelectorAll("#corpoMapaRmb tr");
  if (linhas.length === 0) return alert("Não há dados em tela para salvar. Gere o relatório primeiro.");
  
  const pacoteDados = [];

  linhas.forEach(tr => {
    if (tr.id === "linhaTotalizadorMapa") return; // Ignora o rodapé

    const conta = tr.querySelector(".col-conta").innerText;
    const textoAtual = tr.querySelector(".celula-saldo-atual").innerText;
    
    // Tratamento de conversão da string formatada R$ para float puro de banco de dados
    const saldoAtualFloat = parseFloat(textoAtual.replace(/[R$\s.]/g, "").replace(",", ".")) || 0;

    pacoteDados.push({
      conta: conta,
      saldoAtual: saldoAtualFloat
    });
  });

  const periodo = window.periodoMapaAtivo || "01/2026";

  if (!confirm(`Deseja salvar/sobrescrever o fechamento consolidado do período [${periodo}] na aba MAPA_RMB?`)) return;

  google.script.run
    .withSuccessHandler(function(res) {
      alert(res.message);
    })
    .withFailureHandler(function(err) {
      alert("Erro ao salvar: " + err.message);
    })
    .salvarDadosMapaRMB(periodo, pacoteDados);
}
