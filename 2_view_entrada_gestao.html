<div id="abaGestaoEntradas" class="hidden">
  <div class="home-container" style="padding-top: 0; margin-top: 0;">
    <div class="home-header" style="margin-bottom: 18px; text-align: left;">
      <h1 style="margin-top: 0;">📋 Consultar, Alterar ou Anular Entradas</h1>
      <p>Pesquise registros de entrada por período, usuário, sequencial ou processo.</p>
    </div>

    <!-- CARD DE FILTROS -->
    <div class="card">
      <div class="section-title" style="margin-top: 0;">Filtros de Pesquisa</div>

      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end;">
        <div>
          <label for="filtroEntDataInicio">Data Registro (De)</label>
          <input type="date" id="filtroEntDataInicio">
        </div>

        <div>
          <label for="filtroEntDataFim">Data Registro (Até)</label>
          <input type="date" id="filtroEntDataFim">
        </div>

        <div>
          <label for="filtroEntUsuario">Usuário (E-mail ou Nome)</label>
          <input type="text" id="filtroEntUsuario" placeholder="Ex: nome@ufpe.br">
        </div>

        <div>
          <label for="filtroEntSequencial">Sequencial</label>
          <input type="text" id="filtroEntSequencial" maxlength="10"
                 placeholder="Ex: 2026000001"
                 oninput="this.value = this.value.replace(/\D/g, '')">
        </div>

        <div>
          <label for="filtroEntProcesso">Nº do Processo</label>
          <input type="text" id="filtroEntProcesso" placeholder="Ex: 23076.000000/2026-00">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid #eee;">
        <button type="button" onclick="limparFiltrosEntrada()"
                style="background: #6c757d; color: white; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
          🧹 Limpar
        </button>
        <button type="button" onclick="pesquisarEntradas()"
                style="background: #1F4E78; color: white; border: none; padding: 8px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
          🔍 Pesquisar
        </button>
      </div>
    </div>

    <!-- TABELA DE RESULTADOS -->
    <div class="card" style="padding: 0; overflow: hidden;">
      <div style="overflow-x: auto;">
        <table style="margin-top: 0;">
          <thead>
            <tr>
              <th>Sequencial</th>
              <th>Data Registro</th>
              <th>Processo</th>
              <th>Tipo</th>
              <th>UG / UORG</th>
              <th>Usuário</th>
              <th style="text-align: center;">Itens</th>
              <th style="text-align: center;">Status</th>
              <th style="text-align: center; width: 170px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaResultadosEntradas">
            <tr>
              <td colspan="9" style="text-align: center; color: #666; padding: 24px;">
                Utilize os filtros acima para pesquisar entradas.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
