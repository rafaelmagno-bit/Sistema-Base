<script>
  const MENSAGEM_BLOQUEIO_ADMIN = "Esta ação somente poderá ser realizada por usuários com o perfil ADMIN.";
  let cacheConsultaEntradas = [];
  let perfilAtualGestaoEntradas = "VISUALIZADOR";

  function pesquisarEntradas() {
    const filtros = {
      dataInicio: document.getElementById("filtroEntDataInicio").value,
      dataFim: document.getElementById("filtroEntDataFim").value,
      usuario: document.getElementById("filtroEntUsuario").value,
      sequencial: document.getElementById("filtroEntSequencial").value,
      processo: document.getElementById("filtroEntProcesso").value
    };

    if (typeof mostrarLoader === "function") mostrarLoader();

    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof esconderLoader === "function") esconderLoader();
        if (!res.sucesso) {
          alert("Erro ao pesquisar: " + res.message);
          return;
        }
        cacheConsultaEntradas = res.registros;
        perfilAtualGestaoEntradas = res.perfil;
        renderizarTabelaEntradas(res.registros, res.perfil);
      })
      .withFailureHandler(function(err) {
        if (typeof esconderLoader === "function") esconderLoader();
        alert("Falha de comunicação: " + err.message);
      })
      .consultarEntradasFiltradas(filtros);
  }

  function renderizarTabelaEntradas(lista, perfil) {
    const tbody = document.getElementById("tabelaResultadosEntradas");
    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">Nenhum registro encontrado para os filtros informados.</td></tr>';
      return;
    }

    const hoje = new Date();
    const mesAtual = hoje.getMonth();
    const anoAtual = hoje.getFullYear();

    tbody.innerHTML = lista.map((item, index) => {
      const estaAnulado = item.status.startsWith("ANULADO");
      const ehMesCorrente = (item.mesRegistro === mesAtual && item.anoRegistro === anoAtual);

      // Regras visuais dos botões (mantendo clique ativo para disparar o alerta de permissão)
      const podeAlterar = !estaAnulado && (ehMesCorrente || perfil === "ADMIN");
      const podeAnular = !estaAnulado && (perfil === "ADMIN");

      const classeBtnAlterar = podeAlterar ? "btn-warning" : "btn-outline-secondary";
      const classeBtnAnular = podeAnular ? "btn-danger" : "btn-outline-secondary";

      const badgeStatus = estaAnulado
        ? `<span class="badge badge-danger" title="${item.status}">ANULADO</span>`
        : `<span class="badge badge-success">ATIVO</span>`;

      return `
        <tr class="${estaAnulado ? 'table-secondary text-muted' : ''}">
          <td><strong>${item.sequencial}</strong></td>
          <td>${item.dataRegistroFmt}</td>
          <td>${item.processo}</td>
          <td>${item.tipo}</td>
          <td>${item.ug} / ${item.uorg}</td>
          <td><small>${item.usuario}</small></td>
          <td class="text-center">${item.qtdItens}</td>
          <td class="text-center">${badgeStatus}</td>
          <td class="text-center">
            <button type="button" class="btn btn-sm ${classeBtnAlterar}"
                    onclick="tentarAlterarEntrada(${index})" ${estaAnulado ? 'disabled' : ''}>
              Alterar
            </button>
            <button type="button" class="btn btn-sm ${classeBtnAnular}"
                    onclick="tentarAnularEntrada('${item.sequencial}')" ${estaAnulado ? 'disabled' : ''}>
              Anular
            </button>
          </td>
        </tr>
      `;
    }).join("");
  }

  let sequencialEmEdicao = null; // Variável global que indica se #abaCadastro está editando

function tentarAlterarEntrada(index) {
  const item = cacheConsultaEntradas[index];
  if (!item) return;

  const hoje = new Date();
  const ehMesCorrente = (item.mesRegistro === hoje.getMonth() && item.anoRegistro === hoje.getFullYear());

  if ((!ehMesCorrente && perfilAtualGestaoEntradas !== "ADMIN") || perfilAtualGestaoEntradas === "VISUALIZADOR") {
    alert(MENSAGEM_BLOQUEIO_ADMIN);
    return;
  }

  if (typeof mostrarLoader === "function") mostrarLoader();

  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof esconderLoader === "function") esconderLoader();
      if (!res.sucesso) {
        alert(res.message);
        return;
      }
      abrirCadastroParaEdicao(res.dados);
    })
    .withFailureHandler(function(err) {
      if (typeof esconderLoader === "function") esconderLoader();
      alert("Erro ao carregar dados para edição: " + err.message);
    })
    .obterEntradaCompletaParaEdicao(item.sequencial);
}

function abrirCadastroParaEdicao(dados) {
  sequencialEmEdicao = dados.sequencial;

  // 1. Navega para a tela de Cadastro
  mostrarAba('cadastro');

  // 2. Ajusta título e botão principal
  const tituloCadastro = document.querySelector("#abaCadastro .cadastro-header h2");
  if (tituloCadastro) {
    tituloCadastro.innerHTML = `✏️ Alterando Entrada — Sequencial: <span style="color:#d9534f;">${dados.sequencial}</span>`;
  }
  const btnSalvar = document.getElementById("btnSalvar");
  if (btnSalvar) {
    btnSalvar.innerHTML = "💾 SALVAR ALTERAÇÕES";
    btnSalvar.style.background = "#e67e22";
  }

  // 3. Limpa os inputs de #abaCadastro de forma segura (sem quebrar no #listaItens)
  document.querySelectorAll("#abaCadastro input, #abaCadastro textarea").forEach(el => {
    if (el.type !== "button") el.value = "";
  });

  // 4. Preenche Seção 1: Dados do Processo
  const selectTipo = document.getElementById("tipo");
  if (selectTipo) {
    if (dados.tipo && ![...selectTipo.options].some(o => o.value === dados.tipo)) {
      selectTipo.innerHTML += `<option value="${dados.tipo}">${dados.tipo}</option>`;
    }
    selectTipo.value = dados.tipo || "";
    if (typeof ajustarCamposCondicionais === "function") ajustarCamposCondicionais();
  }

  if (document.getElementById("processo")) document.getElementById("processo").value = dados.processo || "";
  if (document.getElementById("data")) document.getElementById("data").value = dados.dataProcesso || "";

  // UG e UORG
  if (document.getElementById("ug")) document.getElementById("ug").value = dados.ug || "";
  if (document.getElementById("buscaUg")) document.getElementById("buscaUg").value = dados.ug || "";
  if (document.getElementById("uorg")) document.getElementById("uorg").value = dados.uorg || "";
  const buscaUorg = document.getElementById("buscaUorg");
  if (buscaUorg) {
    buscaUorg.disabled = false;
    buscaUorg.value = dados.uorg || "";
  }

  // 5. Preenche Seção 2: Campos Específicos
  const camposSecao2 = {
    empenho: dados.empenho,
    ugEmpenho: dados.ugEmpenho,
    buscaUgEmpenho: dados.ugEmpenho,
    edital: dados.edital,
    beneficiario: dados.beneficiario,
    cpf: dados.cpf,
    siape: dados.siape,
    fade: dados.fade
  };
  Object.keys(camposSecao2).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = camposSecao2[id] || "";
  });

  // 6. Preenche Seção 3: Corresponsável (IDs exatos do 3_scripts.html)
  const camposCorresp = {
    nomeServidor: dados.corresponsavel,
    buscaServidor: dados.corresponsavel,
    cpfServidor: dados.cpfCorresp,
    siapeServidor: dados.siapeCorresp
  };
  Object.keys(camposCorresp).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = camposCorresp[id] || "";
  });

  // 7. Reconstrói as Notas Fiscais e Itens na Tabela Resumo
  const containerNFs = document.getElementById("containerNotasFiscais");
  if (containerNFs && typeof adicionarNotaFiscal === "function") {
    containerNFs.innerHTML = "";
    if (typeof contadorNotas !== "undefined") contadorNotas = 0;

    const listaNFs = (dados.notasFiscais && dados.notasFiscais.length > 0)
      ? dados.notasFiscais
      : [{ numero: "", fornecedor: "", frete: 0, totalNF: 0, itens: [] }];

    listaNFs.forEach(nf => {
      adicionarNotaFiscal();

      const blocos = containerNFs.querySelectorAll(".nota-fiscal-bloco");
      const blocoAtual = blocos[blocos.length - 1];
      if (!blocoAtual) return;

      const vlrFreteNF = Number(nf.frete || 0);
      if (blocoAtual.querySelector(".nf-numero")) blocoAtual.querySelector(".nf-numero").value = nf.numero || "";
      if (blocoAtual.querySelector(".nf-fornecedor")) blocoAtual.querySelector(".nf-fornecedor").value = nf.fornecedor || "";
      if (blocoAtual.querySelector(".nf-frete")) {
        blocoAtual.querySelector(".nf-frete").value = vlrFreteNF.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }
      if (blocoAtual.querySelector(".nf-total")) {
        blocoAtual.querySelector(".nf-total").value = Number(nf.totalNF || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      if (nf.itens && nf.itens.length > 0) {
        const totalUnidadesNF = nf.itens.reduce((acc, item) => acc + (Number(item.qtd) || 0), 0);
        const freteUnitarioSalvo = (vlrFreteNF > 0 && totalUnidadesNF > 0) ? (vlrFreteNF / totalUnidadesNF) : 0;

        blocoNotaAlvoModal = blocoAtual;
        cardItemEmEdicaoModal = null;

        nf.itens.forEach(it => {
          limparCamposModalItemNF();
          document.getElementById("modalItemCadmat").value = it.cadmat ? `${it.cadmat} - ${it.descricao}` : (it.descricao || "");
          document.getElementById("modalItemInfo").value = it.info || "";
          document.getElementById("modalItemMarca").value = it.marca || "";

          const selectConta = document.getElementById("modalItemConta");
          if (selectConta && it.conta) {
            if (![...selectConta.options].some(o => o.value === it.conta)) {
              selectConta.innerHTML += `<option value="${it.conta}">${it.conta}</option>`;
            }
            selectConta.value = it.conta;
          }

          document.getElementById("modalItemQtd").value = it.qtd || 1;
          const valorUnitPuro = Math.max(0, Number(it.valorUnit || 0) - freteUnitarioSalvo);
          document.getElementById("modalItemValor").value = valorUnitPuro.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

          confirmarItemModalNF(true);
        });

        blocoNotaAlvoModal = null;
      }
    });

    recalcularRateioFrete();
  }


  function fecharModalEdicaoEntrada() {
  const modal = document.getElementById("modalEditarEntrada");
  modal.style.display = "none";
  modal.classList.add("hidden");
}

  function salvarAlteracaoEntrada() {
    const payload = {
      sequencial: document.getElementById("editEntSequencial").value,
      processo: document.getElementById("editEntProcesso").value.trim(),
      tipo: document.getElementById("editEntTipo").value.trim(),
      dataDoc: document.getElementById("editEntDataDoc").value,
      ug: document.getElementById("editEntUg").value.trim(),
      uorg: document.getElementById("editEntUorg").value.trim()
    };

    if (typeof mostrarLoader === "function") mostrarLoader();

    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof esconderLoader === "function") esconderLoader();
        if (!res.sucesso) {
          alert(res.message);
          return;
        }
        fecharModalEdicaoEntrada();
        alert(res.message);
        pesquisarEntradas();
      })
      .withFailureHandler(function(err) {
        if (typeof esconderLoader === "function") esconderLoader();
        alert("Erro ao salvar: " + err.message);
      })
      .alterarEntradaRegistro(payload);
  }

  function tentarAnularEntrada(sequencial) {
    // Regra: Anular é exclusivo para ADMIN
    if (perfilAtualGestaoEntradas !== "ADMIN") {
      alert(MENSAGEM_BLOQUEIO_ADMIN);
      return;
    }

    const motivo = prompt(`Informe o motivo para ANULAR a entrada ${sequencial}:`);
    if (motivo === null) return; // Usuário cancelou
    if (motivo.trim().length < 5) {
      alert("Por favor, informe um motivo válido (mínimo 5 caracteres).");
      return;
    }

    if (!confirm(`Tem certeza que deseja ANULAR permanentemente a entrada ${sequencial}?`)) return;

    if (typeof mostrarLoader === "function") mostrarLoader();

    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof esconderLoader === "function") esconderLoader();
        if (!res.sucesso) {
          alert(res.message);
          return;
        }
        alert(res.message);
        pesquisarEntradas();
      })
      .withFailureHandler(function(err) {
        if (typeof esconderLoader === "function") esconderLoader();
        alert("Erro ao anular: " + err.message);
      })
      .anularEntradaRegistro(sequencial, motivo);
  }

  function limparFiltrosEntrada() {
    document.getElementById("filtroEntDataInicio").value = "";
    document.getElementById("filtroEntDataFim").value = "";
    document.getElementById("filtroEntUsuario").value = "";
    document.getElementById("filtroEntSequencial").value = "";
    document.getElementById("filtroEntProcesso").value = "";
    document.getElementById("tabelaResultadosEntradas").innerHTML =
      '<tr><td colspan="9" class="text-center text-muted py-4">Utilize os filtros acima para pesquisar entradas.</td></tr>';
  }
  
</script>
